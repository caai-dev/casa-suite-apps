name: Build apps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CASA-Suite-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish single-file exe
        run: >
          dotnet publish windows/CasaSuite/CasaSuite.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o out
      - uses: actions/upload-artifact@v4
        with:
          name: CASA-Suite-Windows-EXE
          path: out/CASA Suite.exe

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Publish latest test release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp dl/CASA-Suite-Android-APK/app-debug.apk CASA-Suite.apk
          cp "dl/CASA-Suite-Windows-EXE/CASA Suite.exe" CASA-Suite.exe
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest CASA-Suite.apk CASA-Suite.exe \
            --title "Latest test build" --notes "Direct downloads (no zip)." --prerelease
