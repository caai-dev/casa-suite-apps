name: Build apps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.CASA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/casa.jks"
            echo "CASA_KEYSTORE_FILE=$RUNNER_TEMP/casa.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::CASA_KEYSTORE_B64 secret not set - APK uses a temporary debug key"
          fi
      - name: Build APK
        working-directory: android
        env:
          CASA_KEYSTORE_PASS: ${{ secrets.CASA_KEYSTORE_PASS }}
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CASA-Suite-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish single-file exe
        run: >
          dotnet publish windows/CasaSuite/CasaSuite.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o out
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc windows\installer\casa-suite.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: CASA-Suite-Windows
          path: out-installer/CASA-Suite-Setup.exe

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp dl/CASA-Suite-Android-APK/app-debug.apk CASA-Suite.apk
          cp dl/CASA-Suite-Windows/CASA-Suite-Setup.exe CASA-Suite-Setup.exe
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest CASA-Suite.apk CASA-Suite-Setup.exe \
            --title "CASA Suite" --latest \
            --notes "Android: CASA-Suite.apk - Windows: CASA-Suite-Setup.exe"
