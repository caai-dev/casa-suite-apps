<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CASA Suite Native Test</title>
<style>
  body{font-family:system-ui,Segoe UI,Roboto,sans-serif;margin:0;padding:16px;background:#f4f6fa;color:#12202f}
  h1{font-size:20px;margin:0 0 4px}
  p{margin:4px 0 12px;color:#4a5a6a;font-size:14px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  button{border:0;border-radius:10px;padding:12px 16px;background:#1d4ed8;color:#fff;font-size:15px;cursor:pointer}
  button.alt{background:#0f766e}
  input{padding:10px;border:1px solid #c5ced8;border-radius:8px;font-size:15px;width:100%;box-sizing:border-box;margin:4px 0}
  pre{background:#0f172a;color:#d1fae5;padding:12px;border-radius:10px;font-size:13px;white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto}
  .card{background:#fff;border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
</style>
</head>
<body>
<h1>CASA Suite - Native Test</h1>
<p id="plat">Checking native bridge...</p>

<div class="card">
  <b>Quick tests</b>
  <p>Tap an app. If it is installed it should open directly. Otherwise you will see "NOT INSTALLED".</p>
  <div class="row" id="presets"></div>
</div>

<div class="card">
  <b>Custom test</b>
  <input id="android" placeholder="Android package, e.g. com.whatsapp">
  <input id="windows" placeholder="Windows app name, e.g. WhatsApp">
  <div class="row"><button id="custom">Test open</button><button class="alt" id="list">List installed apps (Windows)</button></div>
</div>

<pre id="log">Log will appear here...</pre>

<script>
const PRESETS=[
  ['WhatsApp','com.whatsapp','WhatsApp'],
  ['Excel','com.microsoft.office.excel','Excel'],
  ['Word','com.microsoft.office.word','Word'],
  ['PowerPoint','com.microsoft.office.powerpoint','PowerPoint'],
  ['Teams','com.microsoft.teams','Teams'],
  ['Outlook','com.microsoft.office.outlook','Outlook'],
  ['Google Drive','com.google.android.apps.docs','Google Drive'],
  ['Zoom','us.zoom.videomeetings','Zoom'],
  ['Telegram','org.telegram.messenger','Telegram'],
  ['SalaryBox','in.product.salary','SalaryBox']
];
const logEl=document.getElementById('log');
const log=m=>{logEl.textContent=m+"\n"+logEl.textContent};
function native(){return window.CasaNative||null}
async function test(androidPkg,winName){
  const n=native();
  if(!n){log('No native bridge found. This page is running in a normal browser.');return}
  const arg=n.platform==='android'?androidPkg:winName;
  log('['+n.platform+'] opening: '+arg);
  try{
    const r=await n.open(arg);
    log(r?'OPENED: '+arg:'NOT INSTALLED: '+arg+' (store/web fallback would run here)');
  }catch(e){log('ERROR: '+e)}
}
const pr=document.getElementById('presets');
PRESETS.forEach(([label,a,w])=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>test(a,w);pr.appendChild(b)});
document.getElementById('custom').onclick=()=>test(document.getElementById('android').value.trim(),document.getElementById('windows').value.trim());
document.getElementById('list').onclick=async()=>{
  const n=native();
  if(!n||!n.listApps){log('listApps is only available in the Windows app');return}
  const apps=await n.listApps();
  log('Installed apps ('+apps.length+'):\n'+apps.map(a=>a.name).join('\n'));
};
function init(){
  const n=native();
  document.getElementById('plat').textContent=n?('Native bridge OK - platform: '+n.platform+', v'+n.version):'No native bridge (normal browser)';
}
window.addEventListener('casanativeready',init);
init();
</script>
</body>
</html>
